name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  quality:
    name: Lint, Build e Lighthouse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint HTML
        run: npm run lint:html

      - name: Build CSS
        run: npm run build:css

      - name: Lighthouse CI
        run: npx lhci autorun --config=./lighthouserc.json
